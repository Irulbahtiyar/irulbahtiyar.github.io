name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A72696: ${{ secrets.A72696 }}
          B61095: ${{ secrets.B61095 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A72696', ''), os.environ.get('B61095', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 4576d1b0fbe66c684420066bd99467d2e30e45787ebd -->', a)
          if b:
              patched = patched.replace('<!-- 9b4000cf3ca9b0f4d81a -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
